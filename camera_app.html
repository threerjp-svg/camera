<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カメラ">
<title>カメラ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{width:100%;height:100%;background:#000;}body{width:100%;min-height:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;position:fixed;top:0;left:0;right:0;bottom:0;}
#app{width:100%;height:100%;display:flex;flex-direction:column;background:#000;align-items:center;}
#vf-area{width:100%;flex:1;min-height:0;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#vf-box{position:relative;background:#111;overflow:hidden;}
#video{width:100%;height:100%;object-fit:cover;display:block;}
/* iOSが表示する赤いボタンを非表示 */
#video::-webkit-media-controls { display:none !important; }
#video::-webkit-media-controls-enclosure { display:none !important; }
#video::-webkit-media-controls-panel { display:none !important; }
#video::-webkit-media-controls-start-playback-button { display:none !important; }
video::-webkit-media-controls-overlay-play-button { display:none !important; }
* { -webkit-media-controls: none !important; }
#canvas{display:none;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10;}
#perm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,0.65);font-size:14px;text-align:center;padding:32px;z-index:20;background:#111;}
#start-btn{background:#fff;color:#000;border:none;border-radius:28px;padding:13px 30px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;}
#ctrl{width:100%;background:#0a0a0a;padding:7px 16px calc(env(safe-area-inset-bottom,8px) + 6px);display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
.row{display:flex;justify-content:center;gap:5px;align-items:center;flex-wrap:wrap;}
.p{background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.6);border-radius:16px;padding:4px 11px;font-size:10px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.p.on{background:#fff;color:#000;border-color:#fff;}
.p.ton{background:#FFD700;color:#000;border-color:#FFD700;}
.sep{height:0.5px;background:rgba(255,255,255,0.07);}
#srow{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 0;}
#thumb{width:48px;height:48px;border-radius:9px;background:rgba(255,255,255,0.1);overflow:hidden;border:0.5px solid rgba(255,255,255,0.2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
#timg{width:100%;height:100%;object-fit:cover;display:none;}
#shutter{width:68px;height:68px;border-radius:50%;background:transparent;border:3px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;position:relative;}
#shutter:active{transform:scale(0.92);}
#shutter::after{content:'';width:56px;height:56px;border-radius:50%;background:#fff;}
#flip{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.95);flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;}
#modal.show{display:flex;}
#batch-modal.show{display:flex;}
#mimg{max-width:100%;max-height:58vh;border-radius:10px;object-fit:contain;}
#modal .msg{color:#fff;font-size:14px;text-align:center;line-height:1.8;}
#modal .sub{color:rgba(255,255,255,0.4);font-size:11px;text-align:center;line-height:1.6;}
#save-btn{background:#FFD700;color:#000;border:none;border-radius:22px;padding:13px 32px;font-size:15px;font-weight:700;cursor:pointer;}
#mclose{background:rgba(255,255,255,0.12);color:#fff;border:none;border-radius:22px;padding:10px 28px;font-size:13px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div id="vf-area">
    <div id="vf-box">
      <video id="video" autoplay playsinline muted disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" webkit-playsinline></video>

      <div id="flash"></div>

      <div id="perm">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.3">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span id="permtxt">カメラへのアクセスを許可してください</span>
        <button id="start-btn" onclick="startCam()">カメラを起動</button>
      </div>
    </div>
  </div>

  <div id="ctrl">
    <!-- 1段目: アスペクト比 -->
    <div class="row" id="rrow">
      <button class="p" onclick="setR('1:1')">1:1</button>
      <button class="p on" onclick="setR('3:4')">3:4</button>
      <button class="p" onclick="setR('2:3')">2:3</button>
    </div>
    <div class="sep"></div>
    <!-- 2段目: 画素数 -->
    <div class="row" id="mprow">
      <button class="p" onclick="setMP(2)">200万</button>
      <button class="p on" onclick="setMP(3)">300万</button>
      <button class="p" onclick="setMP(5)">500万</button>
      <button class="p" onclick="setMP(12)">1200万</button>
    </div>
    <div class="sep"></div>
    <!-- 3段目: タイムスタンプ位置 + TS ON/OFF + ライト -->
    <div class="row" id="tsrow">
      <button class="p on" id="tstog" onclick="toggleTS()">TS ON</button>
      <button class="p on" onclick="setTSP('left')">左下</button>
      <button class="p" onclick="setTSP('center')">中央下</button>
      <button class="p" onclick="setTSP('right')">右下</button>
      <button class="p" id="torchbtn" onclick="toggleTorch()">🔦 OFF</button>
    </div>
    <div class="sep"></div>
    <div id="srow">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <div id="thumb" onclick="openM()">
          <svg id="tico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M3 9l4-4 4 4 4-6 4 6"/>
          </svg>
          <img id="timg" alt=""/>
        </div>
        <button id="batch-btn" onclick="openBatch()" style="display:none;background:rgba(255,200,0,0.85);color:#000;border:none;border-radius:12px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer;align-items:center;gap:3px;">
          📁 <span id="batch-count">0枚</span>
        </button>
      </div>
      <button id="shutter" onclick="shoot()"></button>
      <button id="flip" onclick="flipCam()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
          <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="modal">
  <img id="mimg" src="" alt="撮影写真"/>
  <p class="msg">写真を長押し →「写真に追加」で保存<br>または下のボタンをタップ</p>
  <p class="sub" id="save-hint"></p>
  <button id="save-btn" onclick="savePhoto()">💾 写真を保存</button>
  <button id="mclose" onclick="closeM()">閉じる</button>
</div>

<!-- 一括保存モーダル -->
<div id="batch-modal" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.96);flex-direction:column;display:none;align-items:center;gap:10px;padding:16px;">
  <div style="width:100%;display:flex;justify-content:space-between;align-items:center;">
    <span style="color:#fff;font-size:15px;font-weight:600;">撮影した写真</span>
    <button onclick="closeBatch()" style="background:rgba(255,255,255,0.12);color:#fff;border:none;border-radius:16px;padding:6px 14px;font-size:13px;cursor:pointer;">閉じる</button>
  </div>
  <div id="batch-grid" style="width:100%;flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-height:0;"></div>
  <p id="batch-hint" style="color:rgba(255,255,255,0.45);font-size:11px;text-align:center;min-height:16px;"></p>
  <div style="display:flex;gap:10px;width:100%;">
    <button onclick="saveAll()" style="flex:1;background:#FFD700;color:#000;border:none;border-radius:22px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;">💾 まとめて保存</button>
    <button onclick="clearAll()" style="background:rgba(255,60,60,0.3);color:#fff;border:none;border-radius:22px;padding:13px 16px;font-size:13px;cursor:pointer;">🗑️</button>
  </div>
</div>

<canvas id="canvas"></canvas>
<script>
var stream = null;
var facing = 'environment';
var curR = '3:4';
var curMP = 3;
var tsPos = 'left';
var tsOn = true;
var shotN = 0;
var lastUrl = null;
var lastBlob = null;
var photosList = []; // 撮影した写真一覧
var torchOn = false;
var torchSupported = false;

var video = document.getElementById('video');
var canvas = document.getElementById('canvas');
var flash = document.getElementById('flash');

var ratios = {'1:1':1,'3:4':0.75,'2:3':0.6667};
var mpSz = {
  2:{w:1200,h:1600},
  3:{w:1536,h:2048},
  5:{w:1944,h:2592},
  12:{w:3024,h:4032}
};

function updateVF() {
  var area = document.getElementById('vf-area');
  var box = document.getElementById('vf-box');
  var aW = area.offsetWidth;
  var aH = area.offsetHeight;
  var r = ratios[curR];
  var bW = Math.floor(aH * r);
  var bH = aH;
  if (bW > aW) { bW = aW; bH = Math.floor(aW / r); }
  box.style.width = bW + 'px';
  box.style.height = bH + 'px';
}

function getCamConstraints() {
  var w = curMP === 12 ? 4032 : 1920;
  var h = curMP === 12 ? 3024 : 1080;
  return {
    video: {
      facingMode: { ideal: facing },
      width: { ideal: w },
      height: { ideal: h }
    },
    audio: false
  };
}

function startCam() {
  navigator.mediaDevices.getUserMedia(getCamConstraints()).then(function(s) {
    stream = s;
    video.srcObject = stream;
    document.getElementById('perm').style.display = 'none';
    shotEl.style.display = 'block';
    setTimeout(updateVF, 300);
    setTimeout(checkTorch, 500);
  }).catch(function() {
    document.getElementById('permtxt').textContent =
      'カメラが起動できませんでした。Safari設定→カメラを「許可」にしてください。';
  });
}

function checkTorch() {
  if (!stream) return;
  var track = stream.getVideoTracks()[0];
  if (!track) return;
  var caps = track.getCapabilities ? track.getCapabilities() : {};
  torchSupported = !!caps.torch;
}

function toggleTorch() {
  if (!stream) return;
  var track = stream.getVideoTracks()[0];
  if (!track) return;
  if (!torchSupported) {
    alert('このデバイスではライト機能に対応していません');
    return;
  }
  torchOn = !torchOn;
  track.applyConstraints({ advanced: [{ torch: torchOn }] }).then(function() {
    var btn = document.getElementById('torchbtn');
    btn.textContent = torchOn ? '🔦 ON' : '🔦 OFF';
    btn.className = torchOn ? 'p ton' : 'p';
  }).catch(function() {
    torchOn = false;
    alert('ライトの制御に失敗しました');
  });
}

function setR(r) {
  curR = r;
  var btns = document.querySelectorAll('#rrow .p');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].textContent === r ? 'p on' : 'p';
  }
  updateVF();
}

function setMP(mp) {
  curMP = mp;
  var lbl = {2:'約200万画素',3:'約300万画素',5:'約500万画素',12:'約1200万画素'};
  var btn = {2:'200万',3:'300万',5:'500万',12:'1200万'};
  var btns = document.querySelectorAll('#mprow .p');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].textContent === btn[mp] ? 'p on' : 'p';
  }
  if (stream && stream.active) {
    stream.getTracks().forEach(function(t) { t.stop(); });
    stream = null;
    navigator.mediaDevices.getUserMedia(getCamConstraints()).then(function(s) {
      stream = s;
      video.srcObject = stream;
      setTimeout(checkTorch, 500);
    }).catch(function() {});
  }
}

function setTSP(p) {
  tsPos = p;
  var m = {left:'左下',center:'中央下',right:'右下'};
  var btns = document.querySelectorAll('#tsrow .p');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].textContent === m[p] ? 'p on' : 'p';
  }
}

function toggleTS() {
  tsOn = !tsOn;
  var btn = document.getElementById('tstog');
  btn.textContent = tsOn ? 'TS ON' : 'TS OFF';
  btn.className = tsOn ? 'p on' : 'p';
}

function getTS() {
  var n = new Date();
  var p = function(v) { return String(v).padStart(2,'0'); };
  return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+
    ' '+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
}

function shoot() {
  if (!stream) { startCam(); return; }
  var vw = video.videoWidth;
  var vh = video.videoHeight;
  if (!vw || !vh) return;

  flash.style.opacity = '0.85';
  setTimeout(function() { flash.style.opacity = '0'; }, 100);

  var sz = mpSz[curMP];
  var ratio = ratios[curR];
  var outW = sz.w;
  var outH = sz.h;
  if (Math.abs(outW/outH - ratio) > 0.005) {
    if (outW/outH > ratio) outW = Math.round(outH * ratio);
    else outH = Math.round(outW / ratio);
  }

  canvas.width = outW;
  canvas.height = outH;
  var ctx = canvas.getContext('2d');
  var isLand = (vw > vh);

  ctx.save();
  if (isLand) {
    ctx.translate(outW/2, outH/2);
    if (facing === 'user') {
      ctx.rotate(-Math.PI/2);
      ctx.scale(-1, 1);
    } else {
      ctx.rotate(-Math.PI/2);
    }
    ctx.drawImage(video, -vw/2, -vh/2, vw, vh);
  } else {
    var cR = outW/outH;
    var vR = vw/vh;
    var sx, sy, sw, sh;
    if (vR > cR) { sh=vh; sw=Math.round(vh*cR); sy=0; sx=Math.round((vw-sw)/2); }
    else { sw=vw; sh=Math.round(vw/cR); sx=0; sy=Math.round((vh-sh)/2); }
    if (facing === 'user') { ctx.translate(outW,0); ctx.scale(-1,1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, outW, outH);
  }
  ctx.restore();

  if (tsOn) {
    var ts = getTS();
    var fs = Math.round(outW * 0.036);
    ctx.font = 'bold ' + fs + 'px monospace';
    var pad = Math.round(outW * 0.035);
    var tw = ctx.measureText(ts).width;
    var tx;
    if (tsPos === 'left') tx = pad;
    else if (tsPos === 'center') tx = (outW - tw) / 2;
    else tx = outW - tw - pad;
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = fs * 0.5;
    ctx.fillStyle = '#FFD700';
    ctx.fillText(ts, tx, outH - pad);
    ctx.shadowBlur = 0;
  }

  lastUrl = canvas.toDataURL('image/jpeg', 0.92);
  canvas.toBlob(function(blob) {
    lastBlob = blob;
    photosList.push({ url: lastUrl, blob: blob, name: 'photo_' + Date.now() + '.jpg' });
    updateBatchBtn();
  }, 'image/jpeg', 0.92);

  shotN++;
  var ti = document.getElementById('timg');
  document.getElementById('tico').style.display = 'none';
  ti.src = lastUrl;
  ti.style.display = 'block';

  openM();
}

function savePhoto() {
  if (!lastUrl) return;
  var hint = document.getElementById('save-hint');
  if (navigator.share && lastBlob) {
    var file = new File([lastBlob], 'photo_' + Date.now() + '.jpg', { type: 'image/jpeg' });
    navigator.share({ files: [file], title: '写真' }).then(function() {
      hint.textContent = '✅ 共有メニューから「写真に保存」を選んでください';
    }).catch(function(e) {
      if (e.name !== 'AbortError') fallbackSave();
    });
  } else {
    fallbackSave();
  }
}

function fallbackSave() {
  var a = document.createElement('a');
  a.href = lastUrl;
  a.download = 'photo_' + Date.now() + '.jpg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function updateBatchBtn() {
  var btn = document.getElementById('batch-btn');
  var cnt = document.getElementById('batch-count');
  if (photosList.length > 0) {
    btn.style.display = 'flex';
    cnt.textContent = photosList.length + '枚';
  } else {
    btn.style.display = 'none';
  }
}

function openBatch() {
  var grid = document.getElementById('batch-grid');
  grid.innerHTML = '';
  for (var i = 0; i < photosList.length; i++) {
    var item = document.createElement('div');
    item.style.cssText = 'position:relative;aspect-ratio:3/4;background:#222;border-radius:6px;overflow:hidden;';
    var img = document.createElement('img');
    img.src = photosList[i].url;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
    var del = document.createElement('button');
    del.textContent = '✕';
    del.style.cssText = 'position:absolute;top:3px;right:3px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;';
    (function(idx) {
      del.onclick = function() {
        photosList.splice(idx, 1);
        openBatch();
        updateBatchBtn();
      };
    })(i);
    item.appendChild(img);
    item.appendChild(del);
    grid.appendChild(item);
  }
  document.getElementById('batch-modal').className = 'show';
}

function closeBatch() {
  document.getElementById('batch-modal').className = '';
}

function saveAll() {
  if (photosList.length === 0) return;
  var hint = document.getElementById('batch-hint');
  hint.textContent = '保存中... 0/' + photosList.length;

  // Web Share APIで一括共有（iOS対応）
  if (navigator.share && navigator.canShare) {
    var files = [];
    for (var i = 0; i < photosList.length; i++) {
      files.push(new File([photosList[i].blob], photosList[i].name, { type: 'image/jpeg' }));
    }
    if (navigator.canShare({ files: files })) {
      navigator.share({ files: files, title: '写真' }).then(function() {
        hint.textContent = '✅ 共有メニューから「写真に保存」を選んでください';
      }).catch(function(e) {
        if (e.name !== 'AbortError') saveAllFallback();
      });
      return;
    }
  }
  saveAllFallback();
}

function saveAllFallback() {
  // 1枚ずつ順番にダウンロード
  var hint = document.getElementById('batch-hint');
  var idx = 0;
  function next() {
    if (idx >= photosList.length) {
      hint.textContent = '✅ ' + photosList.length + '枚を保存しました';
      return;
    }
    hint.textContent = '保存中... ' + (idx+1) + '/' + photosList.length;
    var a = document.createElement('a');
    a.href = photosList[idx].url;
    a.download = photosList[idx].name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    idx++;
    setTimeout(next, 600);
  }
  next();
}

function clearAll() {
  if (!confirm(photosList.length + '枚の写真をすべて削除しますか？')) return;
  photosList = [];
  updateBatchBtn();
  closeBatch();
}

function openM() {
  if (!lastUrl) return;
  document.getElementById('mimg').src = lastUrl;
  document.getElementById('save-hint').textContent = '';
  document.getElementById('modal').className = 'show';
}
function closeM() {
  document.getElementById('modal').className = '';
}

function flipCam() {
  if (torchOn) {
    var track = stream && stream.getVideoTracks()[0];
    if (track) {
      try { track.applyConstraints({ advanced: [{ torch: false }] }); } catch(e) {}
    }
    torchOn = false;
    document.getElementById('torchbtn').textContent = '🔦 OFF';
    document.getElementById('torchbtn').className = 'p';
  }
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) {
    stream.getTracks().forEach(function(t) { t.stop(); });
    stream = null;
  }
  navigator.mediaDevices.getUserMedia(getCamConstraints()).then(function(s) {
    stream = s;
    video.srcObject = stream;
    setTimeout(checkTorch, 500);
  }).catch(function() {});
}

window.addEventListener('resize', function() { setTimeout(updateVF, 100); });
window.addEventListener('orientationchange', function() { setTimeout(updateVF, 400); });
setTimeout(updateVF, 100);

// Safari UIを隠す
function hideSafariUI() {
  setTimeout(function() { window.scrollTo(0, 1); }, 100);
  setTimeout(updateVF, 300);
}
window.addEventListener('load', hideSafariUI);
window.addEventListener('orientationchange', hideSafariUI);
</script>
</body>
</html>
