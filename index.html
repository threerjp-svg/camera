<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="theme-color" content="#000000">

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-title" content="カメラ">

<title>カメラ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{width:100%;height:100%;background:#000;}
body{
  width:100%;
  height:100vh;
  background:#000;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
#app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#000;
  align-items:center;
}
#vf-area{width:100%;flex:1;min-height:0;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#vf-box{position:relative;background:#000;overflow:hidden;}
#video{width:100%;height:100%;object-fit:cover;display:block;}
#video::-webkit-media-controls { display:none !important; }
#video::-webkit-media-controls-enclosure { display:none !important; }
#video::-webkit-media-controls-panel { display:none !important; }
#video::-webkit-media-controls-start-playback-button { display:none !important; }
video::-webkit-media-controls-overlay-play-button { display:none !important; }
#canvas{display:none;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10;}
#perm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:rgba(255,255,255,0.7);font-size:14px;text-align:center;padding:32px;z-index:20;background:#000;}
#start-btn{background:#fff;color:#000;border:none;border-radius:28px;padding:14px 32px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}

#ctrl{width:100%;background:#080808;padding:6px 14px env(safe-area-inset-bottom);display:flex;flex-direction:column;gap:6px;flex-shrink:0;border-top:0.5px solid rgba(255,255,255,0.05);}
.row{display:flex;justify-content:center;gap:6px;align-items:center;flex-wrap:wrap;}

.p{background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.15);color:#fff;border-radius:16px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 0.1s;}
.p.on{background:#fff;color:#000;border-color:#fff;}
.p.ton{background:#FFD700;color:#000;border-color:#FFD700;}
.sep{height:0.5px;background:rgba(255,255,255,0.05);}

#srow{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 2px;}
#thumb{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,0.05);overflow:hidden;border:1px solid rgba(255,255,255,0.15);cursor:pointer;display:flex;align-items:center;justify-content:center;}
#timg{width:100%;height:100%;object-fit:cover;display:none;}
#shutter{width:72px;height:72px;border-radius:50%;background:transparent;border:4px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.08s;position:relative;}
#shutter:active{transform:scale(0.90);}
#shutter::after{content:'';width:56px;height:56px;border-radius:50%;background:#fff;}
#flip{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.12);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#zoom-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.12);border:none;cursor:pointer;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;}

#modal{
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0; /* ★周りの余白をゼロにして全画面化 */
}
#m-box{
  width:100%;
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  background:#000;
}
#m-img{
  width:100%;  /* ★横幅いっぱいに拡大 */
  height:100%; /* ★縦幅いっぱいに拡大 */
  object-fit:contain; /* 縦横比を崩さず、画面に収まる最大サイズにする */
  display:block;
  user-select:auto;
  -webkit-user-select:auto;
}
#m-ctrl{
  width:100%;
  padding:12px 24px calc(12px + env(safe-area-inset-bottom)); /* 下部のセーフエリアを考慮 */
  background:#080808; /* ボタンの後ろを少し暗くして画像と区別 */
  display:flex;
  justify-content:center;
  align-items:center;
  flex-shrink:0;
  border-top:0.5px solid rgba(255,255,255,0.1);
}

.m-btn{flex:1;max-width:320px;height:50px;border-radius:25px;font-size:16px;font-weight:600;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;}
#m-cancel{background:#4169e1;color:#fff;}
</style>
</head>
<body>
<div id="app">
  <div id="vf-area">
    <div id="vf-box">
      <video id="video" autoplay playsinline muted webkit-playsinline></video>
      <div id="flash"></div>
      <div id="perm">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.3">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span id="permtxt">カメラへのアクセスを許可してください</span>
        <button id="start-btn" onclick="startCam()">カメラを起動</button>
      </div>
    </div>
  </div>

  <div id="ctrl">
    <div class="row" id="rrow">
      <button class="p" onclick="setR('1:1')">1:1</button>
      <button class="p on" onclick="setR('3:4')">3:4</button>
      <button class="p" onclick="setR('2:3')">2:3</button>
      <button class="p" onclick="setR('9:16')">9:16</button>
    </div>
    <div class="sep"></div>
    <div class="row" id="mprow">
      <button class="p" onclick="setMP(2)">200万</button>
      <button class="p on" onclick="setMP(3)">300万</button>
      <button class="p" onclick="setMP(6)">600万</button>
      <button class="p" onclick="setMP(12)">1200万</button>
    </div>
    <div class="sep"></div>
    <div class="row" id="tsrow">
      <button class="p on" id="tstog" onclick="toggleTS()">TS ON</button>
      <button class="p on" onclick="setTSP('left')">Left</button>
      <button class="p" onclick="setTSP('center')">Center</button>
      <button class="p" onclick="setTSP('right')">Right</button>
      <button id="torchbtn" class="p" onclick="toggleTorch()">Flash</button> 
    </div>
    <div class="sep"></div>
    <div id="srow">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <!-- サムネイルタップ時の大きく開く動作（パターンA）を残しています -->
        <div id="thumb" onclick="openLastShot()">
          <svg id="tico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M3 9l4-4 4 4 4-6 4 6"/>
          </svg>
          <img id="timg" alt=""/>
        </div>
      </div>
      <button id="zoom-btn" onclick="toggleZoom()">1x</button>
      <button id="shutter" onclick="shoot()"></button>
      <button id="flip" onclick="flipCam()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
          <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- 確認画面 -->
<div id="modal">
  <div id="m-box">
    <img id="m-img" alt="プレビュー"/>
  </div>
  <div id="m-ctrl">
    <button id="m-cancel" class="m-btn" onclick="closeModal()">Redo</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
var stream = null;
var facing = 'environment';
var curR = '3:4';
var curMP = 3;
var tsPos = 'left';
var tsOn = true;
var shotN = 0;
var lastUrl = null;
var torchOn = false;
var torchSupported = false;
var curZoom = 1;

var video = document.getElementById('video');
var canvas = document.getElementById('canvas');
var flash = document.getElementById('flash');
var modal = document.getElementById('modal');
var mImg = document.getElementById('m-img');

var ratios = {'1:1':1, '3:4':0.75, '2:3':0.6667, '9:16':0.5625};
var mpSz = {
  2:{w:1200,h:1600},
  3:{w:1536,h:2048},
  6:{w:2160,h:2880},
  12:{w:3024,h:4032}
};

function updateVF() {
  var area = document.getElementById('vf-area');
  var box = document.getElementById('vf-box');
  if(!area || !box) return;
  var aW = area.offsetWidth;
  var aH = area.offsetHeight;
  var r = ratios[curR];
  var bW = Math.floor(aH * r);
  var bH = aH;
  if (bW > aW) { bW = aW; bH = Math.floor(aW / r); }
  box.style.width = bW + 'px';
  box.style.height = bH + 'px';
}

function getCamConstraints() {
  var w = curMP === 12 ? 4032 : 1920;
  var h = curMP === 12 ? 3024 : 1080;
  return {
    video: {
      facingMode: { ideal: facing },
      width: { ideal: w },
      height: { ideal: h },
      imageStabilizationMode: { ideal: "standard" }
    },
    audio: false
  };
}

async function startCam() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById('permtxt').textContent = 'このブラウザはカメラに対応していません';
      return;
    }
    const s = await navigator.mediaDevices.getUserMedia(getCamConstraints());
    stream = s;
    video.srcObject = s;
    await video.play().catch(function(){});
    document.getElementById('perm').style.display = 'none';
    setTimeout(updateVF, 300);
    setTimeout(checkTorch, 500);
  } catch(e) {
    console.log(e);
    document.getElementById('permtxt').textContent = 'カメラ起動失敗: ' + e.message;
  }
}

function checkTorch() {
  if (!stream) return;
  var track = stream.getVideoTracks()[0];
  if (!track) return;
  var caps = track.getCapabilities ? track.getCapabilities() : {};
  torchSupported = !!caps.torch;
  
  var btn = document.getElementById('torchbtn');
  btn.className = 'p';
  torchOn = false;
}

function toggleTorch() {
  if (!stream) return;
  var track = stream.getVideoTracks()[0];
  if (!track) return;
  if (!torchSupported) {
    alert('このデバイスはライト機能に対応していないか、インカメラに設定されています');
    return;
  }
  torchOn = !torchOn;
  track.applyConstraints({ advanced: [{ torch: torchOn }] }).then(function() {
    var btn = document.getElementById('torchbtn');
    btn.className = torchOn ? 'p ton' : 'p';
  }).catch(function() {
    torchOn = false;
    alert('ライトの制御に失敗しました');
  });
}

function setR(r) {
  curR = r;
  var btns = document.querySelectorAll('#rrow .p');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].textContent === r ? 'p on' : 'p';
  }
  updateVF();
}

function setMP(mp) {
  curMP = mp;
  var btn = {2:'200万',3:'300万',6:'600万',12:'1200万'};
  var btns = document.querySelectorAll('#mprow .p');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].textContent === btn[mp] ? 'p on' : 'p';
  }
  if (stream && stream.active) {
    stream.getTracks().forEach(function(t) { t.stop(); });
    stream = null;
    navigator.mediaDevices.getUserMedia(getCamConstraints()).then(function(s) {
      stream = s;
      video.srcObject = stream;
      setTimeout(checkTorch, 500);
    }).catch(function() {});
  }
}

function setTSP(p) {
  tsPos = p;
  var m = {left:'Left',center:'Center',right:'Right'};
  var btns = document.querySelectorAll('#tsrow .p');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].textContent === m[p] ? 'p on' : 'p';
  }
}

function toggleTS() {
  tsOn = !tsOn;
  var btn = document.getElementById('tstog');
  btn.textContent = tsOn ? 'TS ON' : 'TS OFF';
  btn.className = tsOn ? 'p on' : 'p';
}

function getTS() {
  var n = new Date();
  var p = function(v) { return String(v).padStart(2,'0'); };
  return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+
    ' '+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
}

function shoot() {
  if (!stream) { startCam(); return; }
  var vw = video.videoWidth;
  var vh = video.videoHeight;
  if (!vw || !vh) return;

  flash.style.opacity = '0.85';
  setTimeout(function() { flash.style.opacity = '0'; }, 100);

  var sz = mpSz[curMP];
  var ratio = ratios[curR];
  var outW = sz.w;
  var outH = sz.h;
  if (Math.abs(outW/outH - ratio) > 0.005) {
    if (outW/outH > ratio) outW = Math.round(outH * ratio);
    else outH = Math.round(outW / ratio);
  }

  canvas.width = outW;
  canvas.height = outH;
  var ctx = canvas.getContext('2d');
  var isLand = (vw > vh);

  ctx.save();
  if (isLand) {
    ctx.translate(outW/2, outH/2);
    if (facing === 'user') {
      ctx.rotate(-Math.PI/2);
      ctx.scale(-1, 1);
    } else {
      ctx.rotate(-Math.PI/2);
    }
    ctx.drawImage(video, -vw/2, -vh/2, vw, vh);
  } else {
    var cR = outW/outH;
    var vR = vw/vh;
    var sx, sy, sw, sh;
    if (vR > cR) { sh=vh; sw=Math.round(vh*cR); sy=0; sx=Math.round((vw-sw)/2); }
    else { sw=vw; sh=Math.round(vw/cR); sx=0; sy=Math.round((vh-sh)/2); }
    if (facing === 'user') { ctx.translate(outW,0); ctx.scale(-1,1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, outW, outH);
  }
  ctx.restore();

  if (tsOn) {
    var ts = getTS();
    var fs = Math.round(outW * 0.036);
    ctx.font = 'bold ' + fs + 'px monospace';
    var pad = Math.round(outW * 0.035);
    var tw = ctx.measureText(ts).width;
    var tx;
    if (tsPos === 'left') tx = pad;
    else if (tsPos === 'center') tx = (outW - tw) / 2;
    else tx = outW - tw - pad;
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = fs * 0.5;
    ctx.fillStyle = '#FFD700';
    ctx.fillText(ts, tx, outH - pad);
    ctx.shadowBlur = 0;
  }

  lastUrl = canvas.toDataURL('image/jpeg', 0.92);

  shotN++;
  var ti = document.getElementById('timg');
  document.getElementById('tico').style.display = 'none';
  ti.src = lastUrl;
  ti.style.display = 'block';
  
  // 大きく確認したい時のために、バックグラウンドのモーダル用画像も更新
  mImg.src = lastUrl; 
}

function flipCam() {
  if (torchOn) {
    var track = stream && stream.getVideoTracks()[0];
    if (track) {
      try { track.applyConstraints({ advanced: [{ torch: false }] }); } catch(e) {}
    }
    torchOn = false;
    document.getElementById('torchbtn').className = 'p';
  }
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) {
    stream.getTracks().forEach(function(t) { t.stop(); });
    stream = null;
  }
  navigator.mediaDevices.getUserMedia(getCamConstraints()).then(function(s) {
    stream = s;
    video.srcObject = s;
    setTimeout(checkTorch, 500);
  }).catch(function() {});
}

async function toggleZoom() {
  if (!stream) return;
  curZoom = (curZoom === 1) ? 2 : 1;
  var track = stream.getVideoTracks()[0];
  if (!track) return;

  var caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.zoom) {
    try {
      await track.applyConstraints({ advanced: [{ zoom: curZoom }] });
      document.getElementById('zoom-btn').textContent = curZoom + 'x';
      return;
    } catch (e) {
      console.log("Standard zoom failed, trying device switch...", e);
    }
  }

  if (stream) {
    stream.getTracks().forEach(function(t) { t.stop(); });
    stream = null;
  }

  var constraints = getCamConstraints();
  if (curZoom === 2) {
    constraints.video.width = { ideal: 4032 };
    constraints.video.height = { ideal: 3024 };
  }

  try {
    var s = await navigator.mediaDevices.getUserMedia(constraints);
    stream = s;
    video.srcObject = s;
    await video.play().catch(function(){});
    document.getElementById('zoom-btn').textContent = curZoom + 'x';
    setTimeout(updateVF, 300);
    setTimeout(checkTorch, 500);
  } catch(e) {
    console.log("Lens switch failed:", e);
    curZoom = 1;
    document.getElementById('zoom-btn').textContent = '1x';
    startCam();
  }
}

// サムネイルをタップした時に確認モーダルを開く関数
function openLastShot() {
  if (!lastUrl) return;
  modal.style.display = 'flex';
}

function closeModal() {
  modal.style.display = 'none';
}

// --- 長押し開始から一定時間後に自動で確認画面を閉じる（Redo）処理 ---
var autoRedoTimer = null;
var previewImage = document.getElementById('m-img');

// 画像に指が触れたらタイマーを開始
previewImage.addEventListener('touchstart', function() {
  if (autoRedoTimer) clearTimeout(autoRedoTimer);
  
  // 3000ms = 3秒後に自動で確認画面を閉じる
  autoRedoTimer = setTimeout(function() {
    closeModal(); 
  }, 3000);
});

// 指が離れた時はタイマーをキャンセル
previewImage.addEventListener('touchend', function() {
  if (autoRedoTimer) {
    clearTimeout(autoRedoTimer);
    autoRedoTimer = null;
  }
});

window.addEventListener('resize', function() { setTimeout(updateVF, 100); });
window.addEventListener('orientationchange', function() { setTimeout(updateVF, 400); });
setTimeout(updateVF, 100);

function hideSafariUI() {
  setTimeout(function() { window.scrollTo(0, 1); }, 100);
  setTimeout(updateVF, 300);
}
window.addEventListener('load', hideSafariUI);
window.addEventListener('orientationchange', hideSafariUI);
</script>
</body>
</html>
