<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="theme-color" content="#0d1117">

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-title" content="カメラ">

<title>カメラ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{width:100%;height:100%;background:#0d1117;}
body{
  width:100%;
  height:100vh;
  background:#0d1117;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
#app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#0d1117;
  align-items:center;
}
#vf-area {
  width:100%;
  flex:1;
  min-height:0;
  position:relative;
  background:#0d1117;
  display:flex;
  align-items:flex-end; 
  justify-content:center;
  overflow:hidden;
  padding-top:40px; 
}
#vf-box{position:relative;background:#010409;overflow:hidden;border-radius:12px;border:1px solid #30363d;}
#video{width:100%;height:100%;object-fit:cover;display:block;}
#video::-webkit-media-controls { display:none !important; }
#video::-webkit-media-controls-enclosure { display:none !important; }
#video::-webkit-media-controls-panel { display:none !important; }
#video::-webkit-media-controls-start-playback-button { display:none !important; }
video::-webkit-media-controls-overlay-play-button { display:none !important; }
#canvas{display:none;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10;}
#perm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#8b949e;font-size:14px;text-align:center;padding:32px;z-index:20;background:#0d1117;}
#start-btn{background:#238636;color:#ffffff;border:1px solid rgba(240,246,252,0.1);border-radius:6px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}

#ctrl{
  width:100%;
  background:#161b22;
  padding:6px 14px calc(8px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:4px;
  flex-shrink:0;
  border-top:1px solid #30363d;
}
.row{display:flex;justify-content:center;gap:6px;align-items:center;flex-wrap:wrap;}

.p{
  background:#21262d;
  border:1px solid #30363d;
  color:#c9d1d9;
  border-radius:6px;
  padding:4px 12px;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition: background-color 0.1s, border-color 0.1s;
}
.p.on {
  background:#1f6feb;
  color:#ffffff;
  border-color:#388bfd;
}
.p.ton {
  background:#9e6a03;
  color:#ffffff;
  border-color:#d29922;
}
.sep{height:1px;background:#30363d;width:100%;margin:1px 0;}

#srow{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 0;width:100%;max-width:440px;margin:0 auto;}

#thumb{width:44px;height:44px;border-radius:6px;background:#0d1117;overflow:hidden;border:1px solid #30363d;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#timg{width:100%;height:100%;object-fit:cover;display:none;}

#shutter{width:62px;height:62px;border-radius:50%;background:transparent;border:4px solid #f0f6fc;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.08s;position:relative;}
#shutter:active{transform:scale(0.92);}
#shutter::after{content:'';width:46px;height:46px;border-radius:50%;background:#f0f6fc;}

#flip{width:40px;height:40px;border-radius:6px;background:#21262d;border:1px solid #30363d;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#zoom-btn{width:40px;height:40px;border-radius:6px;background:#21262d;border:1px solid #30363d;cursor:pointer;color:#c9d1d9;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;}

#modal{
  position:fixed;
  inset:0;
  background:#0d1117;
  z-index:100;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0;
}
#m-box{
  width:100%;
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  background:#0d1117;
}
#m-img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:auto;
  -webkit-user-select:auto;
}
#m-ctrl{
  width:100%;
  padding:16px 24px calc(16px + env(safe-area-inset-bottom));
  background:#161b22;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-shrink:0;
  border-top:1px solid #30363d;
}

.m-btn{flex:1;max-width:320px;height:46px;border-radius:6px;font-size:15px;font-weight:600;border:1px solid #30363d;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;}
#m-cancel{background:#1f6feb;color:#ffffff;border-color:#388bfd;}
</style>
</head>
<body>
<div id="app">
  <div id="vf-area">
    <div id="vf-box">
      <video id="video" autoplay playsinline muted webkit-playsinline></video>
      <div id="flash"></div>
      <div id="perm">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.3">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span id="permtxt">カメラへのアクセスを許可してください</span>
        <button id="start-btn" onclick="startCam()">カメラを起動</button>
      </div>
    </div>
  </div>

  <div id="ctrl">
    <div class="row" id="rrow">
      <button class="p" onclick="setR('1:1')">1:1</button>
      <button class="p on" onclick="setR('3:4')">3:4</button>
      <button class="p" onclick="setR('2:3')">2:3</button>
      <button class="p" onclick="setR('9:16')">9:16</button>
    </div>
    <div class="sep"></div>
    <div class="row" id="mprow">
      <button class="p" onclick="setMP(2)">2MP</button>
      <button class="p on" onclick="setMP(3)">3MP</button>
      <button class="p" onclick="setMP(6)">6MP</button>
      <button class="p" onclick="setMP(12)">12MP</button>
    </div>
    <div class="sep"></div>
    <div class="row" id="tsrow">
      <button class="p on" id="tstog" onclick="toggleTS()">TS ON</button>
      <button class="p" onclick="setTSP('center')">Center</button>
      <button class="p" onclick="setTSP('right')">Right</button>
      <button id="torchbtn" class="p" onclick="toggleTorch()">Flash</button> 
    </div>
    <div class="sep"></div>
    <div id="srow">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <div id="thumb" onclick="openLastShot()">
          <svg id="tico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M3 9l4-4 4 4 4-6 4 6"/>
          </svg>
          <img id="timg" alt=""/>
        </div>
      </div>
      <button id="shutter" onclick="shoot()"></button>
      <button id="zoom-btn" onclick="toggleZoom()">1x</button
      <button id="flip" onclick="flipCam()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9d1d9" stroke-width="1.8">
          <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- 確認画面 -->
<div id="modal">
  <div id="m-box">
    <img id="m-img" alt="プレビュー"/>
  </div>
  <div id="m-ctrl">
    <button id="m-cancel" class="m-btn" onclick="closeModal()">Redo</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
var stream = null;
var facing = 'environment';
var curR = '3:4';
var curMP = 2;
var tsPos = 'center';
var tsOn = true;
var shotN = 0;
var lastUrl = null;
var torchOn = false;
var torchSupported = false;
var curZoom = 1;

var video = document.getElementById('video');
var canvas = document.getElementById('canvas');
var flash = document.getElementById('flash');
var modal = document.getElementById('modal');
var mImg = document.getElementById('m-img');

var ratios = {'1:1':1, '3:4':0.75, '2:3':0.6667, '9:16':0.5625};
var mpSz = {
  2:{w:1200,h:1600},
  3:{w:1536,h:2048},
  6:{w:2160,h:2880},
  12:{w:3024,h:4032}
};

function updateVF() {
  var area = document.getElementById('vf-area');
  var box = document.getElementById('vf-box');
  if(!area || !box) return;
  var aW = area.offsetWidth;
  var aH = area.offsetHeight - 40;
  var r = ratios[curR];
  var bW = Math.floor(aH * r);
  var bH = aH;
  if (bW > aW) { bW = aW; bH = Math.floor(aW / r); }
  box.style.width = bW + 'px';
  box.style.height = bH + 'px';
}

function getCamConstraints() {
  var w = curMP === 12 ? 4032 : 1920;
  var h = curMP === 12 ? 3024 : 1080;
  return {
    video: {
      facingMode: { ideal: facing },
      width: { ideal: w },
      height: { hId: h },
      imageStabilizationMode: { ideal: "standard" }
    },
    audio: false
  };
}

async function startCam() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById('permtxt').textContent = 'このブラウザはカメラに対応していません';
      return;
    }
    const s = await navigator.mediaDevices.getUserMedia(getCamConstraints());
    stream = s;
    video.srcObject = s;
    await video.play().catch(function(){});
    document.getElementById('perm').style.display = 'none';
    setTimeout(updateVF, 300);
    setTimeout(checkTorch, 500);
  } catch(e) {
    console.log(e);
    document.getElementById('permtxt').textContent = 'カメラ起動失敗: ' + e.message;
  }
}

function checkTorch() {
  if (!stream) return;
  var track = stream.getVideoTracks()[0];
  if (!track) return;
  var caps = track.getCapabilities ? track.getCapabilities() : {};
  torchSupported = !!caps.torch;
  
  var btn = document.getElementById('torchbtn');
  btn.className = 'p';
  torchOn = false;
}

function toggleTorch() {
  if (!stream) return;
  var track = stream.getVideoTracks()[0];
  if (!track) return;
  if (!torchSupported) {
    alert('このデバイスはライト機能に対応していないか、インカメラに設定されています');
    return;
  }
  torchOn = !torchOn;
  track.applyConstraints({ advanced: [{ torch: torchOn }] }).then(function() {
    var btn = document.getElementById('torchbtn');
    btn.className = torchOn ? 'p ton' : 'p';
  }).catch(function() {
    torchOn = false;
    alert('ライトの制御に失敗しました');
  });
}

function setR(r) {
  curR = r;
  var btns = document.querySelectorAll('#rrow .p');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].textContent === r ? 'p on' : 'p';
  }
  updateVF();
}

function setMP(mp) {
  curMP = mp;
  /* ★ 判定用文字列を「2MP」の形式に修正しました */
  var btn = {2:'2MP',3:'3MP',6:'6MP',12:'12MP'};
  var btns = document.querySelectorAll('#mprow .p');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].textContent === btn[mp] ? 'p on' : 'p';
  }
  if (stream && stream.active) {
    stream.getTracks().forEach(function(t) { t.stop(); });
    stream = null;
    navigator.mediaDevices.getUserMedia(getCamConstraints()).then(function(s) {
      stream = s;
      video.srcObject = stream;
      setTimeout(checkTorch, 500);
    }).catch(function() {});
  }
}

function setTSP(p) {
  tsPos = p;
  var m = {left:'Left',center:'Center',right:'Right'};
  var btns = document.querySelectorAll('#tsrow .p');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].textContent === m[p] ? 'p on' : 'p';
  }
}

function toggleTS() {
  tsOn = !tsOn;
  var btn = document.getElementById('tstog');
  btn.textContent = tsOn ? 'TS ON' : 'TS OFF';
  btn.className = tsOn ? 'p on' : 'p';
}

function getTS() {
  var n = new Date();
  var p = function(v) { return String(v).padStart(2,'0'); };
  return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+
    ' '+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
}

function shoot() {
  if (!stream) { startCam(); return; }
  var vw = video.videoWidth;
  var vh = video.videoHeight;
  if (!vw || !vh) return;

  flash.style.opacity = '0.85';
  setTimeout(function() { flash.style.opacity = '0'; }, 100);

  var sz = mpSz[curMP];
  var ratio = ratios[curR];
  var outW = sz.w;
  var outH = sz.h;
  if (Math.abs(outW/outH - ratio) > 0.005) {
    if (outW/outH > ratio) outW = Math.round(outH * ratio);
    else outH = Math.round(outW / ratio);
  }

  canvas.width = outW;
  canvas.height = outH;
  var ctx = canvas.getContext('2d');
  var isLand = (vw > vh);

  ctx.save();
  if (isLand) {
    ctx.translate(outW/2, outH/2);
    if (facing === 'user') {
      ctx.rotate(-Math.PI/2);
      ctx.scale(-1, 1);
    } else {
      ctx.rotate(-Math.PI/2);
    }
    ctx.drawImage(video, -vw/2, -vh/2, vw, vh);
  } else {
    var cR = outW/outH;
    var vR = vw/vh;
    var sx, sy, sw, sh;
    if (vR > cR) { sh=vh; sw=Math.round(vh*cR); sy=0; sx=Math.round((vw-sw)/2); }
    else { sw=vw; sh=Math.round(vw/cR); sx=0; sy=Math.round((vh-sh)/2); }
    if (facing === 'user') { ctx.translate(outW,0); ctx.scale(-1,1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, outW, outH);
  }
  ctx.restore();

  if (tsOn) {
    var ts = getTS();
    var fs = Math.round(outW * 0.036);
    ctx.font = 'bold ' + fs + 'px monospace';
    var pad = Math.round(outW * 0.035);
    var tw = ctx.measureText(ts).width;
    var tx;
    if (tsPos === 'left') tx = pad;
    else if (tsPos === 'center') tx = (outW - tw) / 2;
    else tx = outW - tw - pad;
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = fs * 0.5;
    ctx.fillStyle = '#FFD700';
    ctx.fillText(ts, tx, outH - pad);
    ctx.shadowBlur = 0;
  }

  lastUrl = canvas.toDataURL('image/jpeg', 0.92);

  shotN++;
  var ti = document.getElementById('timg');
  document.getElementById('tico').style.display = 'none';
  ti.src = lastUrl;
  ti.style.display = 'block';
  
  mImg.src = lastUrl; 
}

function flipCam() {
  if (torchOn) {
    var track = stream && stream.getVideoTracks()[0];
    if (track) {
      try { track.applyConstraints({ advanced: [{ torch: false }] }); } catch(e) {}
    }
    torchOn = false;
    document.getElementById('torchbtn').className = 'p';
  }
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) {
    stream.getTracks().forEach(function(t) { t.stop(); });
    stream = null;
  }
  navigator.mediaDevices.getUserMedia(getCamConstraints()).then(function(s) {
    stream = s;
    video.srcObject = s;
    setTimeout(checkTorch, 500);
  }).catch(function() {});
}

async function toggleZoom() {
  if (!stream) return;
  curZoom = (curZoom === 1) ? 2 : 1;
  var track = stream.getVideoTracks()[0];
  if (!track) return;

  var caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.zoom) {
    try {
      await track.applyConstraints({ advanced: [{ zoom: curZoom }] });
      document.getElementById('zoom-btn').textContent = curZoom + 'x';
      return;
    } catch (e) {
      console.log("Standard zoom failed, trying device switch...", e);
    }
  }

  if (stream) {
    stream.getTracks().forEach(function(t) { t.stop(); });
    stream = null;
  }

  var constraints = getCamConstraints();
  if (curZoom === 2) {
    constraints.video.width = { ideal: 4032 };
    constraints.video.height = { ideal: 3024 };
  }

  try {
    var s = await navigator.mediaDevices.getUserMedia(constraints);
    stream = s;
    video.srcObject = s;
    await video.play().catch(function(){});
    document.getElementById('zoom-btn').textContent = curZoom + 'x';
    setTimeout(updateVF, 300);
    setTimeout(checkTorch, 500);
  } catch(e) {
    console.log("Lens switch failed:", e);
    curZoom = 1;
    document.getElementById('zoom-btn').textContent = '1x';
    startCam();
  }
}

function openLastShot() {
  if (!lastUrl) return;
  modal.style.display = 'flex';
}

function closeModal() {
  modal.style.display = 'none';
}

var autoRedoTimer = null;
var previewImage = document.getElementById('m-img');

function startPressTimer() {
  if (autoRedoTimer) clearTimeout(autoRedoTimer);
  autoRedoTimer = setTimeout(function() {
    closeModal(); 
  }, 2000);
}

function cancelPressTimer() {
  if (autoRedoTimer) {
    clearTimeout(autoRedoTimer);
    autoRedoTimer = null;
  }
}

previewImage.addEventListener('touchstart', startPressTimer);
previewImage.addEventListener('touchend', cancelPressTimer);

window.addEventListener('resize', function() { setTimeout(updateVF, 100); });
window.addEventListener('orientationchange', function() { setTimeout(updateVF, 400); });
setTimeout(updateVF, 100);

function hideSafariUI() {
  setTimeout(function() { window.scrollTo(0, 1); }, 100);
  setTimeout(updateVF, 300);
}
window.addEventListener('load', hideSafariUI);
window.addEventListener('orientationchange', hideSafariUI);
</script>
</body>
</html>
